<section class="screen-shell">
  <div class="screen-header">
    <div>
      <h1>Knowledge Base</h1>
      <p>Searchable research snippets and trading guidelines</p>
    </div>
    <button type="button" class="refresh-button">Refresh</button>
  </div>

  <div class="search-panel">
    <input type="text" placeholder="Search market concepts, patterns and indicators" />
    <button type="button">Search</button>
  </div>

  <div class="article-list">
    <article class="article-card" *ngFor="let article of articles">
      <div class="article-head">
        <h3>{{ article.title }}</h3>
        <span>Relevance: {{ article.score }}</span>
      </div>
      <p>{{ article.body }}</p>
    </article>
  </div>
</section>
